name: Phase 1 & Emulator Security Verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Build & Firebase Emulator Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      USE_FIREBASE_EMULATOR: 'true'
      VITE_USE_FIREBASE_EMULATOR: 'true'
      FIREBASE_PROJECT_ID: demo-ailea-postmanager-local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 Runtime (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json', 'package.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Ensure Firebase CLI is available
        run: |
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools
          fi
          java -version
          firebase --version

      - name: TypeScript typecheck
        run: npm run lint

      - name: Security rules ESLint check
        run: npm run lint:rules

      - name: Production Vite build
        run: npm run build

      - name: Run full test matrix inside isolated Firebase Emulators
        run: npm run test:emulator
